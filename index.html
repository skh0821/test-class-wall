<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 반 담벼락</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📌</text></svg>">
  <style>
    body { font-family: sans-serif; margin: 20px; }
    h1 { font-size: 24px; }
    .notice { background: #ffe9e9; padding: 10px; }

    /* 로그인 버튼이 들어올 자리 */
    #userArea { margin: 10px 0; color: #666; }

    /* 메모 쓰는 칸 */
    #writer { margin: 16px 0; }
    #writer textarea { width: 400px; font-size: 16px; }

    /* 메모가 붙는 담벼락 */
    #wall { display: flex; flex-wrap: wrap; gap: 10px; }
    .memo { border: 1px solid #ddd; background: #fffde7; padding: 10px; width: 200px; font-size: 15px; }
    .memo button { float: right; }
  </style>
</head>
<body>

  <h1>우리 반 담벼락</h1>

  <!-- 백엔드 1: Firestore 저장이 연동되어 저장 안내문 제거 -->

  <!-- 백엔드 2: 구글 로그인 버튼 및 사용자 정보가 렌더링되는 영역 -->
  <div id="userArea"></div>

  <div id="writer">
    <textarea id="input" rows="3" placeholder="메모를 쓰고 엔터"></textarea>
  </div>

  <!-- AI 코멘트가 표시되는 영역 -->
  <div id="aiArea" style="display: none; margin: 16px 0; padding: 14px 18px; background: #eef7ff; border-left: 4px solid #1a73e8; border-radius: 6px; max-width: 600px;">
    <div style="font-weight: bold; margin-bottom: 6px; color: #1a73e8;">🤖 AI 선생님의 담벼락 코멘트</div>
    <div id="aiContent" style="white-space: pre-wrap; font-size: 14px; line-height: 1.6; color: #333;"></div>
  </div>

  <!-- 메모는 app.js가 그립니다 -->
  <div id="wall"></div>

  <!--
    type="module" 로 불러옵니다.
    Firebase SDK가 import 문법이라, 백엔드 시간에 이 방식이어야 붙일 수 있습니다.
  -->
  <script type="module" src="app.js"></script>
</body>
</html>
